# https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
###
# General settings
###
show_column_numbers = true
# No `python_version`: the oldest one mypy can check for depends on the installed mypy,
# and editors don't need it without a mypy language server.

###
# Even typeshed disables/allows these
# https://github.com/python/typeshed/blob/2e4d4dcf657f82305709bbe3e86bca4d27d4dd46/tests/mypy_test.py#L190-L195
###
allow_untyped_defs = true
allow_incomplete_defs = true
allow_subclassing_any = true

###
# Specific to this project
###
files = .

# Runs on a newer Python than the oldest one mypy checks for, and `python_version` can't be set per module
exclude = ^utils/run_checkers\.py$

