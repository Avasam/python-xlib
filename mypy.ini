# https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
###
# General settings
###
show_column_numbers = true
# No `python_version`: the oldest one mypy can check for depends on the installed mypy,
# and editors don't need it without a mypy language server.

###
# Specific to this project
###

# Only the public API
files = Xlib

# Only a dependency on Python 3.6 and 3.7, and its source has syntax that Python 3.4 doesn't
[mypy-importlib_metadata]
follow_imports = skip

###
# TODO: Error codes that don't pass yet
###

[mypy-Xlib.ext.xinput,Xlib.protocol.event,Xlib.protocol.rq,Xlib.support.unix_connect]
disable_error_code = assignment

[mypy-Xlib.protocol.display]
disable_error_code = var-annotated
