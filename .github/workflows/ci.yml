name: CI

on:
  push:
    branches: [avasam-python-xlib]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  RUFF_OUTPUT_FORMAT: github
  TY_OUTPUT_FORMAT: github

jobs:
  Ruff:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --only-group=ruff ruff check

  # Type checkers run on a recent Python, and check for the oldest Python they support and the newest.
  mypy:
    name: mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    env:
      # mypy only colors its output when it finds the terminal's capabilities
      TERM: xterm-256color
    strategy:
      fail-fast: false
      matrix:
        include:
          # On this Python, the `mypy` group installs the mypy that can check for Python 3.4. See pyproject.toml.
          - python-version: '3.4'
            uv-python: '3.9'
          - python-version: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.uv-python }}
      - run: uv run --locked --only-group=mypy mypy --python-version=${{ matrix.python-version }}

  pyright:
    name: pyright (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.5', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true
      - run: uv sync --locked --only-group=pyright
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          # The version from the lock file
          version: PATH
          python-version: ${{ matrix.python-version }}
          # Hides one "Analysis of function is skipped because it is unannotated" per untyped function
          level: warning

  ty:
    name: ty (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # TODO: Lower to 3.7, ty's own floor, once ty can parse stubs with syntax newer than the target,
        # like `/` for positional-only parameters. https://github.com/astral-sh/ruff/issues/21677
        python-version: ['3.8', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --only-group=ty ty check --python-version=${{ matrix.python-version }}

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # https://docs.python.org/3/library/devmode.html#effects-of-the-python-development-mode
      PYTHONDEVMODE: 1
      # Fail instead of silently building an sdist when a dependency has no wheel for the runner.
      UV_NO_BUILD: 1
    strategy:
      fail-fast: false
      matrix:
        # ARM runners are faster, and every dependency has an arm64 wheel.
        os: [ubuntu-24.04-arm]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.12']
        # PyPy and other OSes: oldest and newest only, to keep the matrix small.
        include:
          # The arm64 PyPy 3.6 build links the system `libffi.so.6`, which Ubuntu 24.04 lacks. The x64 build bundles its own.
          - os: ubuntu-24.04
            python-version: pypy3.6
          # setup-python's oldest arm64 macOS build is 3.8, Intel runners go down to 3.5.
          - os: macos-15-intel
            python-version: '3.5'
          - os: macos-15
            python-version: '3.15'
          # Python 3.3 has no pip to install coverage with on Windows.
          - os: windows-2025
            python-version: '3.4'
          # VcXsrv is x64 only, and runs emulated there.
          - os: windows-11-arm
            python-version: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv refuses Python 3.6 and older, and has no CPython 3.7 or PyPy older than 3.8,
      # so `legacy` jobs use setup-python and pip instead.
      - name: Check whether uv can install this Python
        id: python
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          minor=${PYTHON_VERSION#pypy}
          minor=${minor#3.}
          if [ "$minor" -lt 8 ]; then legacy=true; else legacy=false; fi
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"

      # In `legacy` jobs, only used to export the requirements.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ steps.python.outputs.legacy != 'true' && matrix.python-version || '' }}
          activate-environment: ${{ steps.python.outputs.legacy != 'true' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.python.outputs.legacy == 'true' }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Xvfb
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      # XQuartz ships its own Xvfb, which the tests start like on Linux.
      - name: Install XQuartz
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install --cask xquartz
          echo /opt/X11/bin >> "$GITHUB_PATH"

      # Xvfb isn't available on Windows, so the tests use this server through `XLIB_TEST_DISPLAY`.
      - name: Install and start VcXsrv
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install vcxsrv --yes --no-progress
          # `-noreset`, as for Xvfb: VcXsrv can crash resetting once the last client disconnects, refusing every later test
          Start-Process "$env:ProgramFiles\VcXsrv\vcxsrv.exe" -ArgumentList ':0', '-multiwindow', '-ac', '-noreset'
          $deadline = (Get-Date).AddSeconds(30)
          while ($true) {
            try {
              (New-Object Net.Sockets.TcpClient '127.0.0.1', 6000).Close()
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw 'VcXsrv did not start listening' }
              Start-Sleep -Milliseconds 200
            }
          }
          "XLIB_TEST_DISPLAY=127.0.0.1:0" >> $env:GITHUB_ENV

      - name: Run tests
        if: ${{ steps.python.outputs.legacy != 'true' }}
        run: |
          uv sync --locked --no-default-groups --group test
          coverage run -m unittest -v
          coverage report > coverage.txt
          coverage html

      - name: Run tests with pip
        if: ${{ steps.python.outputs.legacy == 'true' }}
        run: |
          # Fails on syntax newer than this Python, including in the examples and utilities the tests never import.
          python -m compileall -q Xlib test examples utils
          # Python 3.4.4 on Windows can segfault while pip downloads, so retry on a segfault (exit code 139) only.
          pip_install() {
            for attempt in 1 2 3; do
              python -m pip install --disable-pip-version-check "$@" && return
              status=$?
              [ "$status" -eq 139 ] || return "$status"
              echo "::warning::pip segfaulted on attempt $attempt"
            done
            return "$status"
          }
          # The last pip that supports every legacy Python. Python 3.4.4 bundles pip 7.1.2,
          # which predates `--require-hashes` and ignores `Requires-Python`.
          pip_install pip==19.1.1
          uv export --locked --no-emit-project --no-default-groups --group test --output-file "$RUNNER_TEMP/requirements.txt"
          pip_install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          python -m coverage run -m unittest -v
          python -m coverage report > coverage.txt
          python -m coverage html

      # Plain text report, to match `test-docker`, where coverage 6 and older lack `--format=markdown`.
      - name: Write coverage to job summary
        run: |
          {
            echo '### Coverage on Python ${{ matrix.python-version }} (${{ matrix.os }})'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-py${{ matrix.python-version }}-${{ matrix.os }}
          path: htmlcov/

  test-docker:
    name: Python ${{ matrix.python-version }} (${{ matrix.platform }})
    # ARM runners are faster, and every image has an arm64 variant, except python:3.3-alpine.
    runs-on: ${{ matrix.python-version == '3.3' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    env:
      # https://docs.python.org/3/library/devmode.html#effects-of-the-python-development-mode
      # Python 3.6 and older ignore it.
      PYTHONDEVMODE: 1
    strategy:
      fail-fast: false
      matrix:
        # uv refuses Python 3.6 and older and cannot download 3.7, so these run in Docker with pip.
        python-version: ['3.3', '3.4', '3.5', '3.6', '3.7']
        platform: [native]
        # GitHub has no big-endian runner, and uv cannot target s390x,
        # so the big-endian tests run on s390x under QEMU. There is no s390x python:3.3-alpine.
        # Emulation is slow, so oldest and newest only.
        include:
          - python-version: '3.4'
            platform: s390x
          - python-version: '3.15'
            platform: s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ matrix.platform != 'native' }}
        with:
          # Runs privileged, so pinned instead of the default floating `latest`.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: ${{ matrix.platform }}

      - name: Run tests under Xvfb in Docker
        run: |
          uv export --locked --no-emit-project --no-default-groups --group test --output-file "$RUNNER_TEMP/requirements.txt"
          docker run --rm \
            ${{ matrix.platform != 'native' && format('--platform=linux/{0}', matrix.platform) || '' }} \
            --env PYTHONDEVMODE \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP/requirements.txt:/tmp/requirements.txt:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "python:${{ matrix.python-version }}-alpine" \
            sh .github/scripts/docker-tests.sh /tmp/requirements.txt

      # Plain text report, since `coverage report --format=markdown` needs coverage 7.
      - name: Write coverage to job summary
        run: |
          {
            echo '### Coverage on Python ${{ matrix.python-version }} (${{ matrix.platform }})'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-py${{ matrix.python-version }}-${{ matrix.platform }}
          path: htmlcov/
