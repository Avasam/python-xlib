name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      # https://docs.python.org/3/library/devmode.html#effects-of-the-python-development-mode
      # Python 3.6 and older ignore it.
      PYTHONDEVMODE: 1
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        # uv refuses Python 3.6 and older and cannot download 3.7, so these run in Docker with pip.
        include:
          - python-version: '3.3'
            docker: true
          - python-version: '3.4'
            docker: true
          - python-version: '3.5'
            docker: true
          - python-version: '3.6'
            docker: true
          - python-version: '3.7'
            docker: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ !matrix.docker && matrix.python-version || '' }}

      - name: Install Xvfb
        if: ${{ !matrix.docker }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Run tests under Xvfb
        if: ${{ !matrix.docker }}
        run: |
          uv run --locked python -W all -m coverage run -m unittest -v
          uv run --locked coverage xml

      - name: Run tests under Xvfb in Docker
        if: ${{ matrix.docker }}
        # The workspace is mounted at the same path so coverage.xml paths match the host.
        run: |
          uv export --locked --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          docker run --rm \
            --env PYTHONDEVMODE \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP/requirements.txt:/tmp/requirements.txt:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            "python:${{ matrix.python-version }}-alpine" \
            sh .github/scripts/docker-tests.sh /tmp/requirements.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Publish GitHub release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build sdist and wheel
        run: uv build

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --notes ""
          gh release upload "$TAG" dist/*.tar.gz dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
