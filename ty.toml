# https://docs.astral.sh/ty/reference/configuration/
[environment]
# Oldest Python ty can check for. For editors, since uv can't make venvs that old.
python-version = "3.7"

[src]
# Only the public API
include = ["Xlib"]

###
# Even typeshed disables these for stubs
###

[[overrides]]
include = ["**/*.pyi"]
[overrides.rules]
# Incompatible overrides and deprecations are inherited from the implementation
# and are not actionable in typeshed. Keep in sync with pyrightconfig.json.
deprecated = "ignore"
invalid-attribute-override = "ignore"
invalid-method-override = "ignore"
invalid-mutable-override = "ignore"
invalid-property-type-override = "ignore"
override-of-final-method = "ignore"
# Some `__init__` self annotations retain class-scoped type variables for mypy
# compatibility (https://github.com/python/typeshed/pull/11780). Disable ty's
# check; Pyright checks the stubs it covers, with targeted ignores where needed.
invalid-init-type-variable = "ignore"

###
# TODO: Rules that don't pass yet
###

[[overrides]]
include = [
  "Xlib/protocol/display.py",
  "Xlib/protocol/request.py",
]
rules = { invalid-argument-type = "ignore" }

[[overrides]]
include = [
  "Xlib/display.py",
  "Xlib/protocol/display.py",
  "Xlib/threaded.py",
]
rules = { invalid-assignment = "ignore" }

[[overrides]]
include = ["Xlib/ext/xinput.py"]
rules = { invalid-method-override = "ignore" }

[[overrides]]
include = ["Xlib/protocol/display.py"]
rules = { invalid-raise = "ignore" }

[[overrides]]
include = ["Xlib/protocol/display.py"]
rules = { not-iterable = "ignore" }

[[overrides]]
include = [
  "Xlib/protocol/display.py",
  "Xlib/protocol/request.py",
]
rules = { not-subscriptable = "ignore" }

[[overrides]]
include = [
  "Xlib/__init__.py",
  "Xlib/ext/nvcontrol.py",
  "Xlib/ext/record.py",
  "Xlib/protocol/display.py",
  "Xlib/protocol/request.py",
  "Xlib/protocol/rq.py",
  "Xlib/xobject/drawable.py",
]
rules = { unresolved-attribute = "ignore" }

[[overrides]]
include = [
  "Xlib/protocol/display.py",
  "Xlib/protocol/rq.py",
]
rules = { unsupported-operator = "ignore" }
