[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "Xlib"
module-root = ""
source-include = ["test/*.py"]

[project]
name = "avasam-python-xlib"
# `Xlib.__version__` reads this from the installed metadata.
version = "0.33"
description = "Python X Library"
readme = "README.rst"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Peter Liljenberg", email = "petli@ctrl-c.liu.se" }]
maintainers = [{ name = "Avasam" }]
keywords = ["windows", "x", "x11", "xlib"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.3"
dependencies = [
  "importlib-metadata; python_version >= '3.6' and python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/Avasam/python-xlib"
Download = "https://github.com/Avasam/python-xlib/releases"
Changelog = "https://github.com/Avasam/python-xlib/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/Avasam/python-xlib/issues"
Upstream = "https://github.com/python-xlib/python-xlib"

[dependency-groups]
ruff = [
  "beslogic-ruff-config @ git+https://github.com/BesLogic/Beslogic-Ruff-Config@2026.10.31",
  "ruff", # Version should come from beslogic-ruff-config and the lock file
]
test = [
  # uv does not split the lock on versions a release excludes, and coverage 5 dropped 3.3 and 3.4.
  "coverage<5; python_version < '3.5'",
  "coverage; python_version >= '3.5'",
]
dev = [
  { include-group = "ruff" },
  { include-group = "test" }
]

[tool.uv]
exclude-newer = "1 week"
# Tests run against the source tree. Building the project needs uv_build,
# which needs Python>=3.8, so it is not installed into the test environments.
package = false

# Ruff only ships wheels for Python>=3.7. Without this, the lock picks an unbuildable 2022 sdist for older Pythons.
[tool.uv.dependency-groups]
ruff = { requires-python = ">=3.7" }
