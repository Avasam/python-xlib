[build-system]
requires = ["uv_build~=0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "Xlib"
module-root = ""
source-include = ["test/*.py"]

[project]
name = "avasam-python-xlib"
# `Xlib.__version__` reads this from the installed metadata.
# Changing it publishes a release, bump it with `utils/bump-version.sh`. See CONTRIBUTING.md.
version = "0.33"
description = "Python X Library: a drop-in fork of python-xlib, the pure Python X11 client, with bug fixes, speedups and modern packaging"
readme = "README.rst"
license = "LGPL-2.1-or-later AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-typeshed"]
authors = [{ name = "Peter Liljenberg", email = "petli@ctrl-c.liu.se" }]
maintainers = [{ name = "Avasam" }]
keywords = [
  "windows",
  "x",
  "x11",
  "xlib",
  "python-xlib",
  "x window system",
  "x protocol",
  "xorg",
  "xvfb",
  "xwayland",
  "gui",
  "window manager",
  "automation",
  "keyboard",
  "mouse",
  "screenshot",
  "composite",
  "dpms",
  "randr",
  "record",
  "screensaver",
  "shape",
  "xdamage",
  "xfixes",
  "xinerama",
  "xinput",
  "xtest",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: BSD", # Not tested in CI
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Desktop Environment",
  "Topic :: Desktop Environment :: Window Managers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
requires-python = ">=3.3"
dependencies = [
  "importlib-metadata; python_version >= '3.6' and python_version < '3.8'",
]

[project.urls]
Homepage = "https://github.com/Avasam/python-xlib"
Download = "https://github.com/Avasam/python-xlib/releases"
Changelog = "https://github.com/Avasam/python-xlib/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/Avasam/python-xlib/issues"
Upstream = "https://github.com/python-xlib/python-xlib"

[dependency-groups]
# Ruff only ships wheels for Python>=3.7. W/o the markers, the lock picks an unbuildable 2022 sdist for older Pythons.
ruff = [
  "beslogic-ruff-config @ git+https://github.com/BesLogic/Beslogic-Ruff-Config@2026.10.31 ; python_version >= '3.7'",
  "ruff; python_version >= '3.7'", # Version should come from beslogic-ruff-config and the lock file
]
test = [
  # uv does not split the lock on versions a release excludes, and coverage 5 dropped 3.3 and 3.4.
  "coverage<5; python_version < '3.5'",
  "coverage; python_version >= '3.5'",
]
# Third-party imports the type checkers need to resolve.
# uv only reads the lower bound of `requires-python`, so w/o the markers, it picks releases that exclude Python 3.3 and 3.4.
type-checking = [
  "importlib-metadata; python_version >= '3.5'", # Only a dependency on Python 3.6 and 3.7
]
# Type checkers run on a recent Python, whatever version they check for.
# W/o the markers, the lock picks ancient releases for the Pythons they don't install on.
mypy = [
  # The newest mypy that can check for Python 3.4. mypy 2 only checks for Python 3.10 and newer.
  "mypy<1.6; python_version >= '3.8' and python_version < '3.10'",
  "mypy; python_version >= '3.10'",
  { include-group = "type-checking" },
]
pyright = [
  "pyright; python_version >= '3.7'",
  { include-group = "type-checking" },
]
ty = [
  "ty; python_version >= '3.8'",
  { include-group = "type-checking" },
]
dev = [
  { include-group = "mypy" },
  { include-group = "pyright" },
  { include-group = "ruff" },
  { include-group = "test" },
  { include-group = "ty" },
]

[tool.uv]
exclude-newer = "1 week"
# Tests run against the source tree. Building the project needs uv_build,
# which needs Python>=3.8, so it is not installed into the test environments.
package = false
